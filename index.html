<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBA</title>
    <style>
        :root {
            --bg-color: #f7f3ec;
            --header-bg: #d34a44;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        header {
            background-color: var(--header-bg);
            padding: 3rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            color: #fff;
            font-size: 3.5rem;
            letter-spacing: 8px;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        main {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        /* Grade da Galeria */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            aspect-ratio: 4/3;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .card img, .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            pointer-events: none;
        }

        /* Modal / Lightbox estilo Apresentação */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        /* Container que segura a imagem/vídeo para não vazar a tela */
        .modal-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 80px; /* Espaço para as setas */
        }

        .modal-content {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Botão de Fechar */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 1010;
        }
        .close-btn:hover { color: var(--header-bg); }

        /* Setas de navegação no modal */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.6);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1010;
            padding: 20px;
            transition: color 0.3s;
        }
        .nav-arrow:hover { color: white; }
        .arrow-left { left: 10px; }
        .arrow-right { right: 10px; }

        /* Contador */
        .counter {
            position: absolute;
            top: 25px;
            left: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            letter-spacing: 2px;
            z-index: 1010;
        }

    </style>
</head>
<body>

    <header>
        <h1>CUBA</h1>
    </header>

    <main>
        <div class="gallery-grid" id="gallery">
            <!-- As fotos e vídeos serão injetados aqui pelo JavaScript -->
        </div>
    </main>

    <!-- Modal para visualização ampliada com navegação -->
    <div class="modal" id="mediaModal">
        <span class="counter" id="modalCounter"></span>
        <span class="close-btn" onclick="closeModal()">&times;</span>
        
        <button class="nav-arrow arrow-left" onclick="prevMedia(event)">&#10094;</button>
        
        <div class="modal-content-wrapper" id="modalBody" onclick="closeIfClickedOutside(event)">
            <!-- A mídia (img ou vídeo) entrará aqui -->
        </div>
        
        <button class="nav-arrow arrow-right" onclick="nextMedia(event)">&#10095;</button>
    </div>

    <script>
        // Criar uma lista (Array) única com todas as mídias para podermos navegar entre elas
        const mediaList = [];
        
        // 1 a 32 (.jpeg)
        for (let i = 1; i <= 32; i++) {
            mediaList.push({ type: 'image', src: `${i}.jpeg` });
        }
        // v1 a v8 (.mp4)
        for (let i = 1; i <= 8; i++) {
            mediaList.push({ type: 'video', src: `v${i}.mp4` });
        }

        const gallery = document.getElementById('gallery');
        let currentModalIndex = 0; // Guarda qual mídia está aberta no momento

        // Renderizar a Grade (Grid) na página inicial
        mediaList.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(index);
            
            if (item.type === 'image') {
                card.innerHTML = `<img src="${item.src}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=Foto+não+encontrada'">`;
            } else {
                card.innerHTML = `
                    <video src="${item.src}" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>
                    <div class="play-icon">▶</div>
                `;
            }
            gallery.appendChild(card);
        });

        // Controle do Modal / Lightbox
        const modal = document.getElementById('mediaModal');
        const modalBody = document.getElementById('modalBody');
        const counter = document.getElementById('modalCounter');

        function openModal(index) {
            currentModalIndex = index;
            updateModalContent();
            modal.classList.add('active');
        }

        function updateModalContent() {
            const item = mediaList[currentModalIndex];
            counter.innerText = `${currentModalIndex + 1} / ${mediaList.length}`;
            modalBody.innerHTML = ''; // Limpa a mídia anterior

            if (item.type === 'image') {
                modalBody.innerHTML = `<img src="${item.src}" class="modal-content">`;
            } else if (item.type === 'video') {
                modalBody.innerHTML = `<video src="${item.src}" class="modal-content" controls autoplay playsinline></video>`;
            }
        }

        function closeModal() {
            modal.classList.remove('active');
            modalBody.innerHTML = ''; // Limpa para o vídeo parar de tocar
        }

        // Navegação nas setas
        function nextMedia(e) {
            if(e) e.stopPropagation(); // Impede que o clique na seta feche o modal
            if (currentModalIndex < mediaList.length - 1) {
                currentModalIndex++;
            } else {
                currentModalIndex = 0; // Volta pra primeira
            }
            updateModalContent();
        }

        function prevMedia(e) {
            if(e) e.stopPropagation(); // Impede que o clique na seta feche o modal
            if (currentModalIndex > 0) {
                currentModalIndex--;
            } else {
                currentModalIndex = mediaList.length - 1; // Vai pra última
            }
            updateModalContent();
        }

        // Fechar ao clicar no fundo preto (mas não na foto/setas)
        function closeIfClickedOutside(e) {
            if (e.target === modalBody) {
                closeModal();
            }
        }

        // Navegação pelo teclado
        document.addEventListener('keydown', (e) => {
            if (!modal.classList.contains('active')) return; // Só funciona se o modal estiver aberto

            if (e.key === "Escape") {
                closeModal();
            } else if (e.key === "ArrowRight") {
                nextMedia();
            } else if (e.key === "ArrowLeft") {
                prevMedia();
            }
        });
    </script>
</body>
</html>
